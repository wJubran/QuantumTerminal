name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. You can write in English or Arabic — يمكنك الكتابة بالعربية أو بالإنجليزية.

        **Security problems:** please don't report them here; see the [security policy](https://github.com/wJubran/QuantumTerminal/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. python launcher.py --sim
        2. Open the XAUUSD chart
        3. ...
    validations:
      required: true
  - type: dropdown
    id: feed
    attributes:
      label: Data feed
      options:
        - Simulated market (--sim)
        - MetaTrader 5
        - Rithmic
        - Other
    validations:
      required: true
  - type: dropdown
    id: app
    attributes:
      label: How do you run it?
      options:
        - In the browser (python launcher.py)
        - Desktop app (Electron)
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in the terminal's footer and in the VERSION file.
      placeholder: "1.1.0"
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 / macOS 15 / Ubuntu 24.04
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Console output or backend.log around the problem (its path is printed when the terminal starts). Remove account numbers before posting.
      render: text
