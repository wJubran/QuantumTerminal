name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: You can write in English or Arabic — يمكنك الكتابة بالعربية أو بالإنجليزية.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: The situation you're in and what is hard or missing today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
